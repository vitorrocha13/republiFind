services:
  db:
    image: postgres:17-alpine
    container_name: republifind-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: republifind
      POSTGRES_PASSWORD: republifind
      POSTGRES_DB: republifind
    ports:
      - "5432:5432"
    volumes:
      - republifind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U republifind -d republifind"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  republifind_pgdata:
